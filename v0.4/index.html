  <body>
    <div id="game"></div>
    <div id="scanlines"></div>
    <button id="gear" type="button">⚙ 设置</button>
    <div id="settings" hidden>
      <h3>设置</h3>
      <label>震屏强度 <input id="set-shake" type="range" min="0" max="100" step="5" /> <span id="set-shake-v"></span></label>
      <label>减少闪烁 <input id="set-flash" type="checkbox" /></label>
      <label>扫描线 <input id="set-scan" type="checkbox" /></label>
      <button id="set-close" type="button">关闭</button>
      <div class="tip">← → 走，K 跳，↓ 蹲，↑ 朝上瞄，J 射击，L 手鼓雷。G 放行埋伏点（这一版代替清怪），T 试射一颗敌方骰子（看光晕和落点红圈）。Esc 打开 / 关闭设置。</div>
    </div>
